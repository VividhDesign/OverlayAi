<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Titlebar ── -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="status-dot" id="statusDot"></div>

      <!-- Provider toggle -->
      <div class="provider-tabs">
        <button class="provider-tab" id="tabOllama" data-provider="ollama" title="Local Ollama">
          🦙 Ollama
        </button>
        <button class="provider-tab" id="tabGemini" data-provider="gemini" title="Google Gemini">
          ✦ Gemini
        </button>
        <button class="provider-tab" id="tabGroq" data-provider="groq" title="Groq (Fast Inference)">
          ⚡ Groq
        </button>
      </div>

      <!-- Model selector -->
      <select class="model-select" id="modelSelect">
        <option value="">Loading…</option>
      </select>
    </div>

    <div class="titlebar-right">
      <button class="icon-btn" id="settingsBtn" title="API Key settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 12 2v2a8 8 0 0 1 5.66 2.34M4.93 4.93A10 10 0 0 0 2 12h2a8 8 0 0 1 2.34-5.66M19.07 19.07A10 10 0 0 1 12 22v-2a8 8 0 0 0 5.66-2.34M4.93 19.07A10 10 0 0 0 12 22v-2a8 8 0 0 1-5.66-2.34"/>
        </svg>
      </button>
      <button class="icon-btn" id="clearBtn" title="New Chat (⌘N)">
        <!-- compose / new-chat icon -->
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
          <path d="M18.37 2.63a2 2 0 0 1 2.83 2.83L12 14.5l-4 1 1-4z"/>
        </svg>
      </button>
      <button class="icon-btn" id="hideBtn" title="Hide (⌘⇧Space)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Settings panel (slide-down) ── -->
  <div class="settings-panel" id="settingsPanel" style="display:none;">
    <div class="settings-row">
      <label class="settings-label">Gemini API Key</label>
      <div class="settings-input-row">
        <input type="password" id="apiKeyInput" class="settings-input" placeholder="Paste your Gemini API key…" autocomplete="off" />
        <button class="settings-save-btn" id="saveKeyBtn">Save</button>
      </div>
    </div>
    <div class="settings-row">
      <label class="settings-label">Groq API Key</label>
      <div class="settings-input-row">
        <input type="password" id="groqKeyInput" class="settings-input" placeholder="Paste your Groq API key…" autocomplete="off" />
        <button class="settings-save-btn" id="saveGroqKeyBtn">Save</button>
      </div>
    </div>
    <div class="settings-hint">Keys stored locally in config.json — never sent anywhere except their respective APIs</div>
  </div>

  <!-- ── Messages ── -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcomeEl">
      <div class="welcome-icon" id="welcomeIcon">🦙</div>
      <div class="welcome-title" id="welcomeTitle">Ollama AI Assistant</div>
      <div class="welcome-sub">Running 100% locally · Powered by Ollama</div>
      <div class="shortcut-hint">
        <kbd>⌘⇧Space</kbd> hide &nbsp;·&nbsp; <kbd>⌘⇧S</kbd> screenshot
      </div>
    </div>
  </div>

  <!-- ── Screenshot preview ── -->
  <div class="screenshot-preview" id="screenshotPreview" style="display:none;">
    <div class="ss-header">
      <span class="ss-label">📸 Screenshot attached</span>
      <button class="ss-remove" id="ssRemove" title="Remove">✕</button>
    </div>
    <img class="ss-thumb" id="ssThumb" src="" alt="screenshot preview" />
    <div class="ss-hint">Press Enter to analyze, or type a question first</div>
  </div>

  <!-- ── Input ── -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="userInput"
        placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-footer">
      <span id="modelLabel">No model selected</span>
      <span class="ss-shortcut-hint"><kbd>⌘⇧S</kbd> screenshot</span>
      <span class="quit-link" id="quitBtn">Quit</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
